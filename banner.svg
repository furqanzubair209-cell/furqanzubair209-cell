<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0a1330"/>
      <stop offset="100%" stop-color="#05122a"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22e5c0"/>
      <stop offset="55%" stop-color="#3fa8f4"/>
      <stop offset="100%" stop-color="#7c7ff0"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f8f7a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f8f7a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1565c9" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0b3f80" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2a52" stroke-width="1" opacity="0.35"/>
    </pattern>

    <radialGradient id="vignette" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <text x="70" y="70" font-family="'Fira Code', 'Courier New', monospace" font-size="34" fill="#3a5a8f" opacity="0.45">&lt;/&gt;</text>
  <text x="1085" y="245" font-family="'Fira Code', 'Courier New', monospace" font-size="30" fill="#3a5a8f" opacity="0.4">{ }</text>

  <g fill="#7fd9c9">
    <circle cx="150" cy="180" r="3" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="60" r="3.5" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1135" cy="115" r="2.5" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="255" cy="215" r="2" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.65;0.15" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="200" r="2.5" opacity="0.55">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="140" font-family="'Fira Code', 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" fill="url(#textGrad)" text-anchor="middle">Muhammad Furqan</text>

  <text x="600" y="182" font-family="'Fira Code', 'Segoe UI', Arial, sans-serif" font-size="20" fill="#b9c6e3" text-anchor="middle">Frontend Software Engineer &#183; AI/ML Developer &#183; Automation Builder</text>

  <path d="M0,260 C150,230 300,290 450,255 C600,225 750,285 900,250 C1020,225 1120,255 1200,240 L1200,300 L0,300 Z" fill="url(#waveGrad1)"/>
  <path d="M0,280 C180,250 320,300 480,270 C650,240 800,300 960,265 C1060,245 1140,270 1200,258 L1200,300 L0,300 Z" fill="url(#waveGrad2)"/>

  <rect width="1200" height="300" fill="url(#vignette)"/>
</svg>
